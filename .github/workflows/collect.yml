# Collecte automatique chaque jour à 6 h (heure de Paris en hiver).
# Ajoute les secrets SUPABASE_URL et SUPABASE_SECRET_KEY dans
# GitHub > Settings > Secrets and variables > Actions.
name: Collecte des événements

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
